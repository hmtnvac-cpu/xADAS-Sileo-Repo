name: Publish Sileo Repo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install APT tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev

      - name: Rebuild package indexes
        run: |
          chmod +x scripts/rebuild-repo.sh
          ./scripts/rebuild-repo.sh

      - name: Commit regenerated indexes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Release
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild APT indexes"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
